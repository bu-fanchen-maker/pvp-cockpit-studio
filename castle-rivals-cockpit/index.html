<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<title>Castle Rivals Cockpit — Salt Castle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f4f2; --surface:#fcfcfb; --surface-2:#eceeea; --ink:#141513; --ink-2:#4f524d; --muted:#8a8c86;
  --grid:#e1e2dc; --axis:#c2c4bd; --ring:rgba(20,21,19,.10); --accent:#2a78d6; --accent-ink:#1c5cab;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --r1:#b7d3f1; --r2:#6ea3e2; --r3:#2a78d6; --r4:#143f7d;   /* ordered ramp: lowest -> highest bucket */
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px; --shadow:0 1px 2px rgba(20,21,19,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111211; --surface:#1a1b19; --surface-2:#232420; --ink:#f4f4f0; --ink-2:#c0c2b8; --muted:#8a8c86;
    --grid:#2b2c29; --axis:#3a3b37; --ring:rgba(255,255,255,.10); --accent:#3987e5; --accent-ink:#86b6ef;
    --good:#0ca30c; --good-ink:#0ca30c;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --shadow:none;
    --r1:#2f4d75; --r2:#3f78b8; --r3:#6aa3ea; --r4:#b9d6f7;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111211; --surface:#1a1b19; --surface-2:#232420; --ink:#f4f4f0; --ink-2:#c0c2b8; --muted:#8a8c86;
  --grid:#2b2c29; --axis:#3a3b37; --ring:rgba(255,255,255,.10); --accent:#3987e5; --accent-ink:#86b6ef;
  --good:#0ca30c; --good-ink:#0ca30c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --shadow:none;
    --r1:#2f4d75; --r2:#3f78b8; --r3:#6aa3ea; --r4:#b9d6f7;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;margin:0}
.app{max-width:1680px;margin:0 auto;padding:0 20px 48px;display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto auto auto 1fr;gap:0 28px}
.app>header,.app>#root,.app>.jump{grid-column:2}
aside.side{grid-column:1;grid-row:1 / span 4;position:sticky;top:0;align-self:start;height:100vh;overflow:auto;padding:22px 0 24px;border-right:1px solid var(--grid);padding-right:20px}
@media (max-width:980px){.app{grid-template-columns:1fr}.app>header,.app>#root{grid-column:1}aside.side{grid-column:1;grid-row:auto;position:static;height:auto;border-right:0;padding-right:0;border-bottom:1px solid var(--grid);margin-bottom:16px}.app>.jump{grid-column:1}}
.side .blk{margin-bottom:16px}
.side .blk>label{display:block;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.side .seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.side .seg.wrap button{border-right:1px solid var(--axis);border-bottom:1px solid var(--axis)}
.side .seg.wrap button:nth-child(3n){border-right:0}.side .seg.wrap button:nth-last-child(-n+3){border-bottom:0}
.lastx{display:flex;align-items:center;gap:6px;margin-top:6px;font:400 12px var(--mono);color:var(--ink-2)}
.lastx label{font:400 12px var(--mono);color:var(--ink-2);text-transform:none;letter-spacing:0;margin:0}
.lastx input{width:56px}
.lastx .quick{margin-left:auto}
.side .seg button{padding:7px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.side .seg button:disabled{color:var(--muted);cursor:not-allowed;opacity:.6}
.side .hint{font:400 11px var(--mono);color:var(--muted);margin-top:4px}
.modes{display:grid;gap:6px}
.modes button{text-align:left;padding:9px 12px;font-size:13px;border:1px solid var(--axis);border-radius:var(--r);background:var(--surface);color:var(--ink-2);font:500 13px var(--sans);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.modes button:disabled{opacity:.6;cursor:not-allowed;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modes .soon{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:2px 7px}
.gopt input[type=radio]{accent-color:var(--accent)}
.gsel{position:relative}
.gsel>button{width:100%;appearance:none;border:1px solid var(--axis);background:var(--surface);color:var(--ink);font:500 13px var(--font);padding:8px 10px;border-radius:var(--r);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.gsel .list{display:none;position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--axis);border-radius:var(--r);box-shadow:0 6px 20px rgba(0,0,0,.12);padding:6px}
.gsel.open .list{display:block}
.gopt{display:grid;grid-template-columns:16px 1fr;gap:2px 8px;align-items:center;padding:6px 6px;border-radius:4px;font-size:13px;cursor:pointer}
.gopt:hover{background:var(--surface-2)}
.gopt small{grid-column:2;font:400 10px var(--mono);color:var(--muted)}
.gopt.off{color:var(--muted)}
.range{position:relative;height:34px;margin-top:4px}
.range input[type=range]{position:absolute;left:0;right:0;top:10px;width:100%;margin:0;appearance:none;background:transparent;pointer-events:none;height:16px}
.range input[type=range]::-webkit-slider-thumb{appearance:none;pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent);cursor:pointer}
.range input[type=range]::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:pointer}
.range .track{position:absolute;left:0;right:0;top:17px;height:3px;background:var(--axis);border-radius:2px}
.range .fill{position:absolute;top:17px;height:3px;background:var(--accent);border-radius:2px}
.rlabs{display:flex;justify-content:space-between;font:400 12px var(--mono);color:var(--ink-2)}
#btn-refresh{width:100%;appearance:none;border:1px solid var(--axis);background:var(--surface);color:var(--ink);font:600 13px var(--font);padding:9px 10px;border-radius:var(--r);cursor:pointer;margin-top:6px}
#btn-refresh.dirty{background:var(--accent);color:#fff;border-color:var(--accent)}
#btn-refresh:disabled{opacity:.6;cursor:wait}
.myview{margin-top:14px;padding-top:12px;border-top:1px solid var(--grid)}.vbtns{display:flex;gap:6px;margin-top:6px}.vbtns button{appearance:none;border:1px solid var(--axis);background:var(--surface);color:var(--ink-2);font:500 12px var(--font);padding:6px 8px;border-radius:var(--r);cursor:pointer;flex:1}.vbtns button:first-child{color:var(--accent-ink);border-color:var(--accent)}
a{color:var(--accent-ink)}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:22px 14px}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.top .sub{color:var(--ink-2);margin-top:4px;max-width:78ch}
.gamerow{display:flex;align-items:center;gap:12px;margin-top:2px}
.gamerow select{font:600 14px var(--font);padding:5px 10px}
.gamerow select option:disabled{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font:400 12px var(--mono);color:var(--ink-2)}
.meta b{color:var(--ink);font-weight:500}

.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-bottom:1px solid var(--grid);margin-bottom:22px}
.fgroup{display:flex;align-items:center;gap:6px}
.fgroup label{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--axis);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:500 13px var(--font);padding:5px 11px;cursor:pointer;border-right:1px solid var(--axis)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:focus-visible,select:focus-visible,input:focus-visible,.tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=date]{font:500 13px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:var(--r);padding:4px 8px}
input[type=date]{font-family:var(--mono);font-weight:400}
.quick{display:inline-flex;gap:4px}
.quick button{appearance:none;border:1px solid var(--axis);background:transparent;color:var(--ink-2);font:500 11px var(--mono);border-radius:4px;padding:3px 7px;cursor:pointer}
.quick button:hover{background:var(--surface-2)}
.fnote{margin-left:auto;font:400 12px var(--mono);color:var(--muted)}

.tiles{display:grid;gap:10px;grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:22px}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:10px 12px 8px;box-shadow:var(--shadow);min-width:0}
.tile .k{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px;line-height:1.1}
.tile .d{font:400 11px var(--mono);color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:12px 14px 10px;box-shadow:var(--shadow);min-width:0;position:relative;display:flex;flex-direction:column}
.card.full{grid-column:1 / -1}
.card .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.card h3{font-size:14px;font-weight:600}
.card .sub{color:var(--muted);font-size:12px;margin-top:1px;max-width:70ch}
/* long explanations are on demand: one-line teaser that expands on click; definitions and "How to read this" fold into <details> */
.card .ch .sub,.qhead p{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.card .ch .sub.open,.qhead p.open{display:block;-webkit-line-clamp:unset}
.more{appearance:none;border:0;background:transparent;color:var(--accent-ink);font:500 11px var(--mono);cursor:pointer;padding:0;margin-top:1px}
details.fold{margin-top:8px}
details.fold>summary{list-style:none;cursor:pointer;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'›';display:inline-block;transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold>summary:hover{color:var(--ink)}
details.fold .notes{margin-top:8px}
details.fold .defs{border-top:0;margin-top:6px;padding-top:0}
details.fold .sub{margin-top:6px}
.tbtn{appearance:none;border:1px solid var(--axis);background:transparent;color:var(--ink-2);font:500 11px var(--mono);border-radius:4px;padding:2px 7px;cursor:pointer;flex:none}
.tbtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.plot{position:relative;flex:1}
.plot svg{display:block;width:100%;height:auto;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font:400 12px var(--mono);color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{color:var(--muted);font-size:13px;padding:28px 0;text-align:center}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:400 12px var(--mono);padding:6px 8px;border-radius:4px;white-space:nowrap;z-index:3;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tip b{font-weight:500;display:block;margin-bottom:2px}
.tip .row{display:flex;gap:10px;justify-content:space-between}
.tbl{overflow:auto;max-height:520px;margin-top:4px}
table{border-collapse:collapse;width:100%;font:400 12px var(--mono);font-variant-numeric:tabular-nums}
th,td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--surface);z-index:1}
td.bar{position:relative}
td.bar span{position:absolute;left:6px;top:3px;bottom:3px;background:var(--crit);opacity:.18;border-radius:2px}
td.bar span.b{background:var(--accent)}td.bar span.f{background:var(--s2)}
.svgtext{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.card .dot{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--cat,var(--s1));vertical-align:-1px;margin-right:7px}
.card h3 .q{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:8px}
.card.cat-prog{--cat:#1baf7a}.card.cat-eng{--cat:#2a78d6}.card.cat-meta{--cat:#7a5cd6}.card.cat-eco{--cat:#c98500}
.card[class*=cat-]{border-top:3px solid var(--cat)}
.card[class*=cat-] h3{color:var(--cat)}
.card .tgl{margin:2px 0 10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}.card .tgl .seg{display:inline-flex;flex-wrap:wrap;width:auto}.card .tgl .seg .tbtn{font:500 12px var(--font);padding:5px 10px}
.card .seg .tbtn+.tbtn{box-shadow:-1px 0 0 var(--axis)}.card .seg .tbtn[aria-pressed="true"]{box-shadow:none}.card .seg .tbtn[aria-pressed="true"]+.tbtn{box-shadow:none}
.card .tgl .row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.card .tgl .row2 .seg{display:inline-flex;width:auto}.card .tgl .row2 .seg .tbtn{font-size:11.5px;padding:3px 9px}
.card .tgl .lbl{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:48px}
.card .tgl+.tgl{margin-top:-4px}
.note-net{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.card.cat-tbl .tbl{max-height:none}
table.lb td,table.lb th{padding:7px 10px;font-size:12.5px}table.lb td:first-child{font-family:var(--font);font-weight:600;color:var(--ink)}
.tr{font-size:10px;margin-left:3px}.tr.good{color:var(--good)}.tr.bad{color:var(--crit)}
.card .defs{border-top:1px dashed var(--ring);margin-top:10px;padding-top:8px;font-size:11.5px;color:var(--muted);line-height:1.5}
.card .defs b{color:var(--ink)}
.combo{display:flex;align-items:flex-start;width:100%}
.plot .combo svg.axis{flex:none;width:60px;height:auto}
.combo .axcol{flex:none;display:flex;flex-direction:column;width:60px}.combo .axcol svg.axis{display:block}
.combo .scroll{flex:0 1 auto;min-width:0;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:4px}
.plot .combo .scroll svg{display:block;width:auto;height:auto;max-width:none}
.gridline{stroke:var(--grid);stroke-width:1}
.baseline{stroke:var(--axis);stroke-width:1}
.notes{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r);padding:14px 16px;color:var(--ink-2);font-size:13px}
.notes h2{font-size:14px;margin-bottom:8px;color:var(--ink)}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:3px 0}
.notes code{font:400 12px var(--mono);background:var(--surface-2);padding:1px 4px;border-radius:3px}

/* collapsible groups */
.jump{position:sticky;top:0;z-index:6;align-self:start;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0 10px;margin-bottom:6px;background:var(--bg)}
.jump button{appearance:none;border:1px solid var(--ring);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 12px var(--mono);letter-spacing:.02em;cursor:pointer}
.jump button:hover{border-color:var(--ink-2)}
.jump button.soon{color:var(--muted)}
.grp{scroll-margin-top:52px;margin-bottom:14px;border:1px solid var(--ring);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.grph{width:100%;appearance:none;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer;display:grid;grid-template-columns:18px auto 1fr auto;align-items:center;gap:10px;padding:14px 16px;font:inherit}
.grph .chev{display:inline-block;font-size:20px;line-height:1;color:var(--muted);transition:transform .15s}
.grp.open .grph .chev{transform:rotate(90deg)}
.grph .t{font-size:16px;font-weight:600}
.grph .s{color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grph .n{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 9px}
.grph:hover{background:var(--surface-2)}
.grpb{display:none;padding:4px 16px 16px;border-top:1px solid var(--grid)}
.grp.open .grpb{display:block}
.grpb section.q{margin-bottom:10px}
.grpb .qhead{border-top:0;padding-top:12px}
.grp.soon .grph .t,.grp.soon .grph .s{color:var(--ink-2)}
.soonbox{padding:10px 2px 2px;color:var(--ink-2);font-size:13px;max-width:820px}.soonbox p{margin:0 0 6px}.soonbox ul{margin:0 0 8px;padding-left:18px}.soonbox li{margin:3px 0}.soonbox li b{color:var(--ink);font-weight:600}.soonbox .muted{color:var(--muted);font-size:12px}.soonbox code{font:12px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:4px}
@media (max-width:700px){.grph{grid-template-columns:18px 1fr auto}.grph .s{display:none}}
@media (max-width:980px){.card .plot>svg{max-height:380px}}
/* sections */
section.q{margin-bottom:38px}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 24px;margin-bottom:12px;padding-top:6px;border-top:2px solid var(--ink)}
.qhead h2{font-size:16px}
.qhead h2{font-size:18px;font-weight:600;margin-top:4px}
.qhead .num{display:none}
.qhead p{margin:3px 0 0;color:var(--ink-2);max-width:88ch;font-size:13px}
.qctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qctl .row2{display:flex;align-items:center;gap:10px}.qctl .row2+.row2{border-left:1px solid var(--axis);padding-left:16px;margin-left:6px}
.qctl .lbl{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.qctl .seg .tbtn{font:500 12px var(--font);padding:4px 10px}
input[type=number]{font:400 13px var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:var(--r);padding:4px 6px}
.fnote-inline{font:400 12px var(--mono);color:var(--ink-2);margin:-4px 0 12px}
.fnote-top{grid-column:2;font:400 12px var(--mono);color:var(--muted);margin:-6px 0 18px}
@media (max-width:980px){.fnote-top{grid-column:1}}
.fnote-inline .warn{color:var(--serious)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:4px}

const FK = { n1: F.n1, n2: F.n2, pct: F.pct, pct1: F.pct1, k: v => v == null || isNaN(v) ? '–' : Math.abs(v) >= 1e6 ? nf1.format(v / 1e6) + 'M' : Math.abs(v) >= 1e4 ? nf0.format(v / 1e3) + 'k' : Math.abs(v) >= 1e3 ? nf1.format(v / 1e3) + 'k' : nf0.format(v) };
/** per-dsi aggregates for one game under the current filters -> Map dsi -> {active, cohort, ..., median, p90, atLast} */
function dailyAgg(ds) {
  const thru = ds.DY.meta.data_through, last = ds.DY.meta.last_arena;
  const by = new Map(); const cohortCells = new Map();
  for (const r of ds.DYROWS) {
    if (r.d < state.from || r.d > state.to) continue;
    if (state.platform !== 'all' && r.p !== state.platform) continue;
    if (!countryOk(r.c)) continue;
    if (dayDiff(r.d, thru) < r.dsi) continue;               // cohort not old enough for this day
    let o = by.get(r.dsi); if (!o) { o = { active: 0, cohort: 0, sess_sec: 0, matches: 0, cum_matches: 0, unl_s: 0, unl_n: 0, lvl_s: 0, lvl_n: 0, deck_s: 0, deck_n: 0, coins: 0, gems: 0, cards: 0, mats: 0, roster: 0, dist: new Map() }; by.set(r.dsi, o); }
    for (const k of ['active', 'sess_sec', 'matches', 'cum_matches', 'unl_s', 'unl_n', 'lvl_s', 'lvl_n', 'deck_s', 'deck_n', 'coins', 'gems', 'cards', 'mats']) o[k] += r[k] || 0;
    o.roster = Math.max(o.roster, r.roster || 0);

}

const MIN_COHORT = 300;
/** Consistent-cohort retention. For each game: pick the deepest horizon N whose mature install days (install + N <= data_through) still hold

function retentionSeries(G, xs, def) {

    const ds = DATA[x.g.slug];

      if (!ds.PF) continue;
      const agg = profitAgg(ds), th = ds.PF.meta.data_through, HZ = [30, 14, 7, 3, 1];
      let pick = null;
      for (const N of HZ) { const S = [...agg.keys()].filter(d => mature(d, N, th)); const inst = S.reduce((a, d) => a + (agg.get(d).installs || 0), 0); if (S.length && inst >= MIN_COHORT) { pick = { N, S, inst }; break; } }
      if (!pick) { caps.push(`${x.g.short || x.g.name}: fewer than ${MIN_COHORT} installs old enough for D1`); continue; }
      const vals = xs.map(d => { if (d === 0 || d > pick.N || ![1, 3, 7, 14, 30].includes(d)) return null; let u = 0; for (const dd of pick.S) u += agg.get(dd)[`d${d}_users`] || 0; return div(u, pick.inst); });
      series.push({ name: x.g.name, color: x.color, connectNulls: true, values: vals });
      caps.push(`${x.g.short || x.g.name}: installs ${F.date(pick.S[0])} – ${F.date(pick.S[pick.S.length - 1])} (n = ${F.int(pick.inst)}), through D${pick.N}`);
      base.push({ g: x.g, n: pick.inst });
    } else {
      if (!ds.DY) continue;
      const th = ds.DY.meta.data_through;
      // cohort size per install day (sum over the sidebar's platform / country cells), and active players per (install day, dsi)
      const coh = new Map(), act = new Map();
      for (const r of ds.DYROWS) {
        if (r.d < state.from || r.d > state.to) continue;
        if (state.platform !== 'all' && r.p !== state.platform) continue;
        if (!countryOk(r.c)) continue;
        if (r.dsi === 0) coh.set(r.d, (coh.get(r.d) || 0) + (r.cohort || 0));
        const k = r.d + '|' + r.dsi; act.set(k, (act.get(k) || 0) + (r.active || 0));
      }
      let pick = null;
      for (let N = 30; N >= 1; N--) { const S = [...coh.keys()].filter(d => dayDiff(d, th) >= N); const n = S.reduce((a, d) => a + coh.get(d), 0); if (S.length && n >= MIN_COHORT) { pick = { N, S: S.sort(), n }; break; } }
      if (!pick) { caps.push(`${x.g.short || x.g.name}: fewer than ${MIN_COHORT} installs old enough for D1`); continue; }
      const vals = xs.map(d => { if (d === 0 || d > pick.N) return null; let a = 0; for (const dd of pick.S) a += act.get(dd + '|' + d) || 0; return div(a, pick.n); });
      series.push({ name: x.g.name, color: x.color, values: vals });
      caps.push(`${x.g.short || x.g.name}: installs ${F.date(pick.S[0])} – ${F.date(pick.S[pick.S.length - 1])} (n = ${F.int(pick.n)}), through D${pick.N}`);
      base.push({ g: x.g, n: pick.n });

  }

  const extra = () => `<div class="row" style="color:var(--muted)"><span>cohort</span><span>${base.map(b => `${b.g.short || b.g.name} ${F.int(b.n)}`).join(' · ')}</span></div>`;
  return { series, caption, extra };
}

/** Retention by install cohort for one game: per install date, retention at each horizon (events: active/cohort; adjust: dN_users/installs). -> {xs, at(d,N), coh(d)} */
function retentionByCohort(ds, def) {
  const HZ = [1, 3, 7, 14, 30];
  if (def === 'adjust') {
    if (!ds.PF) return null;
    const agg = profitAgg(ds), th = ds.PF.meta.data_through, xs = [...agg.keys()].filter(d => (agg.get(d).installs || 0) > 0).sort();
    return { HZ, xs, th, coh: d => agg.get(d).installs, at: (d, N) => mature(d, N, th) ? div(agg.get(d)[`d${N}_users`] || 0, agg.get(d).installs) : null };
  }
  if (!ds.DY) return null;
  const th = ds.DY.meta.data_through, coh = new Map(), act = new Map();
  for (const r of ds.DYROWS) {

    if (state.platform !== 'all' && r.p !== state.platform) continue;

const isoWeekStart = d => { const x = new Date(d + 'T00:00:00Z'); const wd = (x.getUTCDay() + 6) % 7; x.setUTCDate(x.getUTCDate() - wd); return x.toISOString().slice(0, 10); };

  if (o.stack) { const bw = Math.min(56, Math.max(2, slot * 0.7)); for (let i = 0; i < n; i++) { let pos = 0; for (const s of o.stack) { const v = s.values[i] || 0; if (!(v > 0)) continue; const y0 = Y(pos + v), y1 = Y(pos); pos += v; el('rect', { x: X(i) - bw / 2, y: y0, width: bw, height: Math.max(0, y1 - y0 - 0.8), fill: s.color, opacity: 0.9 }, svg); }
    if (pos === 0) el('rect', { x: X(i) - bw / 2, y: Y(0) - 2, width: bw, height: 2, fill: C.axis }, svg); } }   // a day with data but nothing to stack (e.g. zero revenue) gets a thin grey mark instead of a hole

      if (isProv(i)) { if (last != null) dp += 'M' + X(last).toFixed(1) + ' ' + Y(s.values[last]).toFixed(1) + 'L' + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = false; return; }

// ================= Leaderboard + Gates tables (PvP Hub Health / Gaming Gates framework), averaging window anchored on the latest data day
const WIN_LABEL = { 7: 'rolling 7 days', 30: 'rolling 30 days', month: 'this month' };

/** per-game window metrics. Calendar metrics: days in [start,end]. Cohort metrics at horizon N: install days in [start-N, end-N] (the cohorts whose day N fell inside the window). */
function windowMetrics(x, W) {

  const inRange = (d, a, b) => d >= a && d <= b;

    m.ecpi = div(m.spend, m.inst); m.iapShare = div(m.iap, m.ad + m.iap);
    const pr = cal.filter(o => (o.spend || 0) >= 100 && (o.pd120 || 0) > 0);   // predicted D120 ROAS over the window's UA install days that have a prediction
    m.pd120 = pr.length ? div(pr.reduce((a, o) => a + o.pd120, 0), pr.reduce((a, o) => a + o.spend, 0)) : null;

      const inst = rows.reduce((a, o) => a + (o.installs || 0), 0);
      const ua = rows.filter(o => (o.spend || 0) >= 100);   // ROAS only over real UA days (>= $100), as in the charts

      lineChart($('.plot', c1), { x: ks, series: [{ name: 'payer conversion', color: C.s2, values: vals }], yfmt: F.pct1, h: 280, maxLabels: 16, xfmt: k => 'D' + k, xfull: k => `D${k}`, extra: () => `<div class="row" style="color:var(--muted)"><span>installs</span><span>${F.int(inst)} (${S.length ? F.date(S[0]) + ' – ' + F.date(S[S.length - 1]) : '–'})</span></div>` });
      legend(c1, []);
      const cap = document.createElement('div'); cap.className = 'sub'; cap.style.marginTop = '4px'; cap.innerHTML = `<b>Curve</b> — one population: the install days old enough to have lived D${K} (${S.length ? F.date(S[0]) + ' – ' + F.date(S[S.length - 1]) : '–'}, n = ${F.int(inst)}), so every point is the same players. Exact per day of first purchase.`; c1.appendChild(cap);
    } else if (evMode) {
      const xs = M.xs.filter(d => M.by.get(d).installs >= state.dayMin);
      perfChart($('.plot', c1), { x: xs, h: 280, yfmt: F.pct1, xfmt: F.date, maxLabels: 12,
        lines: MZ.map((n, i) => ({ name: `D${n}`, color: MZ_COLOR(i), values: xs.map(d => dayDiff(d, M.thru) >= n ? div(M.by.get(d).pay[n], M.by.get(d).installs) : null) })),
        extra: i => { const o = M.by.get(xs[i]); return `<div class="row" style="color:var(--muted)"><span>installs · payers by D${H}</span><span>${F.int(o.installs)} · ${F.int(o.pay[H])}</span></div>`; } });
      legend(c1, MZ.map((n, i) => ({ name: `D${n}`, color: MZ_COLOR(i) })));
    } else {
      const HZm = [0, 7, 30];
      perfChart($('.plot', c1), { x: uaXs, h: 280, yfmt: F.pct1, xfmt: F.date, maxLabels: 12,
        lines: HZm.map(n => ({ name: `D${n}`, color: MZ_COLOR(MZ.indexOf(n)), values: uaXs.map(d => mature(d, n, pthru) ? div(P.get(d)[`d${n}_payers`], P.get(d).installs) : null) })),
        extra: i => `<div class="row" style="color:var(--muted)"><span>installs</span><span>${F.int(P.get(uaXs[i]).installs)}</span></div>` });
      legend(c1, HZm.map(n => ({ name: `D${n}`, color: MZ_COLOR(MZ.indexOf(n)) })));
    }
    c1.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { state.convSrc = b.dataset.t; render(); });
    if (hasPayers && P && !curveMode) { const cap = document.createElement('div'); cap.className = 'sub'; cap.style.marginTop = '4px'; cap.innerHTML = '<b>Why two sources?</b> They should agree within a point or two. If Adjust is higher, the game is missing purchase events (SDK or validation gap); if the game events are higher, Adjust is missing installs or revenue (attribution gap). Either way it is a tracking issue to raise before anyone trusts the number.'; c1.appendChild(cap); }
  }
  // ---- repeat purchase. Population = every payer, clocked from their FIRST purchase (not from install), so late converters count the same as D0 payers.
  //      Curve view (default): share who bought again within k days of the first purchase, one line per weekly first-purchase cohort — "do payers keep buying, and is it getting better?"
  //      By first-purchase date: share who bought again within +1 / +3 / +7 / +14 days, per first-purchase date — the evolution view.
  if (hasPayers) {
    const view = state.repView === 'curve' ? 'curve' : state.repView === 'fp' ? 'fp' : 'cohort';
    const PAY = [];   // {fp: first-purchase date, age: days since first purchase lived, gap: days to the 2nd purchase (Infinity = none yet)}
    for (const d of M.xs) for (const at of M.by.get(d).vec) if (at.first !== Infinity) PAY.push({ fp: addDays(d, at.first), age: dayDiff(d, M.thru) - at.first, gap: at.second === Infinity ? Infinity : at.second - at.first });
    const cr = card(view === 'cohort' ? 'Repeat payers — % of installs by install cohort' : view === 'curve' ? 'Repeat purchase — share of payers who bought again, by days since their first purchase' : 'Repeat purchase by first-purchase date',
      view === 'cohort' ? 'Per install date: share of ALL installs who had made two or more purchases by day N — the Soft Launch Tableau "Repeat Rate" definition (repeat payers ÷ installs). It climbs with the horizon by construction and reads together with payer conversion: repeat % ÷ conversion % = the share of payers who repeat.'
        : view === 'curve' ? 'Every payer is clocked from their own first purchase, whatever day it happened. Each line = the payers whose first purchase fell in that week; a point at +k days uses the week\'s payers who have lived k days (drawn while they are at least half the week). Newer weeks above older ones = repeat buying is improving; the dashed line is the long-run shape over all payers old enough.'
        : 'Per first-purchase date: share of that day\'s new payers who bought again within 1 / 3 / 7 / 14 days. A point appears once every payer of that day has lived the window.', 'full');
    grid.appendChild(cr);
    const vr = document.createElement('div'); vr.className = 'tgl'; vr.innerHTML = `<div class="row2"><span class="lbl">View</span><div class="seg" style="font-size:0"><button class="tbtn" style="border:0;border-radius:0" aria-pressed="${view === 'cohort'}" data-rp="cohort">% of installs (Tableau)</button><button class="tbtn" style="border:0;border-radius:0" aria-pressed="${view === 'curve'}" data-rp="curve">Payers: repeat curve</button><button class="tbtn" style="border:0;border-radius:0" aria-pressed="${view === 'fp'}" data-rp="fp">Payers: by first-purchase date</button></div></div>`; cr.insertBefore(vr, $('.plot', cr));
    vr.querySelectorAll('[data-rp]').forEach(b => b.onclick = () => { state.repView = b.dataset.rp; render(); });
    if (view === 'cohort') {
      const xs = M.xs.filter(d => M.by.get(d).installs >= state.dayMin);
      const HZr = [1, 3, 7, 14, 30];
      const rep = (d, n) => { const o = M.by.get(d); if (dayDiff(d, M.thru) < n) return null; let r = 0; for (const at of o.vec) if (at[n][1] >= 2) r++; return div(r, o.installs); };
      perfChart($('.plot', cr), { x: xs, h: 280, yfmt: F.pct1, xfmt: F.date, maxLabels: 12, xfull: d => F.date(d) + ' install cohort',
        lines: HZr.map(n => ({ name: `D${n}`, color: hzColor(n), values: xs.map(d => rep(d, n)) })),
        extra: i => { const o = M.by.get(xs[i]); return `<div class="row" style="color:var(--muted)"><span>installs · payers by D7</span><span>${F.int(o.installs)} · ${dayDiff(xs[i], M.thru) >= 7 ? F.int(o.pay[7]) : '·'}</span></div>`; } });
      legend(cr, HZr.map(n => ({ name: `D${n}`, color: hzColor(n) })));
    } else if (!PAY.length) $('.plot', cr).innerHTML = '<div class="empty">No payers in this slice yet</div>';
    else if (view === 'curve') {
      const weeks = new Map(); for (const p of PAY) { const w = isoWeekStart(p.fp); if (!weeks.has(w)) weeks.set(w, []); weeks.get(w).push(p); }
      const KMAX = Math.min(30, Math.max(...PAY.map(p => p.age))); const ks = []; for (let k = 0; k <= KMAX; k++) ks.push(k);
      // a week's point at +k uses the week's payers who have lived k days, and is drawn while they are still at least half of the week (so the running week is not cut to one day by its newest payer)
      const W = [...weeks.entries()].sort().filter(([, ps]) => ps.length >= MIN_PAYERS).map(([w, ps]) => ({ w, n: ps.length, values: ks.map(k => { const old = ps.filter(p => p.age >= k); return old.length >= MIN_PAYERS && old.length * 2 >= ps.length ? div(old.filter(p => p.gap <= k).length, old.length) : null; }) }));
      // "All payers" = one fixed population: the payers old enough for the deepest k that still holds >= 30 of them (so this line only climbs)
      let KA = KMAX, P0 = []; for (KA = KMAX; KA >= 1; KA--) { P0 = PAY.filter(p => p.age >= KA); if (P0.length >= 30) break; }
      const allV = ks.map(k => k > KA || !P0.length ? null : div(P0.filter(p => p.gap <= k).length, P0.length));
      lineChart($('.plot', cr), { x: ks, h: 280, maxLabels: 16, yfmt: F.pct1, yMax: 1, xfmt: k => '+' + k + 'd', xfull: k => k === 0 ? 'same day as the first purchase' : k + ' days after the first purchase',
        series: [...W.map((w, i) => ({ name: 'First purchase week of ' + F.date(w.w) + ` (${F.int(w.n)} payers)`, color: WK_COLOR(i), values: w.values })), { name: `All payers old enough for +${KA}d (${F.int(P0.length)})`, color: C.ink, dash: '5 4', values: allV }] });
      legend(cr, [...W.map((w, i) => ({ name: 'Week of ' + F.date(w.w), color: WK_COLOR(i) })), { name: 'All payers', color: C.ink }]);
    } else {
      const byFp = new Map(); for (const p of PAY) { if (!byFp.has(p.fp)) byFp.set(p.fp, []); byFp.get(p.fp).push(p); }
      const xs = [...byFp.keys()].sort().filter(d => byFp.get(d).length >= MIN_PAYERS);
      const HZr = [1, 3, 7, 14];
      const rep = (d, n) => { const ps = byFp.get(d); return dayDiff(d, M.thru) < n ? null : div(ps.filter(p => p.gap <= n).length, ps.length); };
      perfChart($('.plot', cr), { x: xs, h: 280, yfmt: F.pct1, yMax: 1, xfmt: F.date, maxLabels: 12, xfull: d => F.date(d) + ' first purchases',
        lines: HZr.map(n => ({ name: `within ${n} day${n > 1 ? 's' : ''}`, color: hzColor(n), values: xs.map(d => rep(d, n)) })),
        extra: i => `<div class="row" style="color:var(--muted)"><span>new payers that day</span><span>${F.int(byFp.get(xs[i]).length)}</span></div><div class="row" style="color:var(--muted)"><span>days with under ${MIN_PAYERS} new payers hidden</span><span></span></div>` });
      legend(cr, HZr.map(n => ({ name: `within ${n}d`, color: hzColor(n) })));
    }
  }
  // ---- 4. IAP share of voice by calendar day (mart)
  if (P) {
    const sovShare = state.sovMode !== 'abs';
    const c4 = card('Revenue mix — IAP vs ads by calendar day', `Net IAP revenue and ad revenue earned each day${sovShare ? ', as a share of the day\'s total' : ''}. The IAP share rising while total revenue grows is the midcore monetisation taking over from the ad floor.`, 'full', [{ v: 'share', label: '% share', on: sovShare }, { v: 'abs', label: '$', on: !sovShare }]);
    grid.appendChild(c4);
    perfChart($('.plot', c4), { x: pxs, h: 260, yfmt: sovShare ? F.pct : F_usdK, yMax: sovShare ? 1 : 0, xfmt: F.date, maxLabels: 12, lines: [],
      stack: [{ name: 'IAP net revenue', color: C.s2, values: pxs.map(d => { const o = P.get(d); return sovShare ? div(o.iap_net, o.iap_net + o.ad_rev) : o.iap_net; }) }, { name: 'Ad revenue', color: C.s1, values: pxs.map(d => { const o = P.get(d); return sovShare ? div(o.ad_rev, o.iap_net + o.ad_rev) : o.ad_rev; }) }],
      extra: i => { const o = P.get(pxs[i]); return `<div class="row"><span><b>Total net revenue</b></span><span><b>${F_usdK(o.iap_net + o.ad_rev)}</b></span></div><div class="row" style="color:var(--muted)"><span>IAP share</span><span>${F.pct1(div(o.iap_net, o.iap_net + o.ad_rev))}</span></div>`; } });
    legend(c4, [{ name: 'IAP net revenue', color: C.s2 }, { name: 'Ad revenue', color: C.s1 }]);
  }
  // ---- 2 / 3. payer size and payer frequency at horizon H, by install date (two panels each: % of payers, % of IAP revenue)
  if (hasPayers) {
    const xs = M.xs.filter(d => dayDiff(d, M.thru) >= H && M.by.get(d).vec.length >= MIN_PAYERS);
    const mix = (bins, pick) => xs.map(d => { const o = M.by.get(d); const n = bins.map(() => 0), r = bins.map(() => 0); let tot = 0, totR = 0, top = [];
      for (const at of o.vec) { const [cum, tx] = at[H]; if (tx <= 0) continue; const v = pick(cum / 100, tx); let i = bins.findIndex(e => v < e); if (i < 0) i = bins.length - 1; n[i]++; r[i] += cum; tot++; totR += cum; top.push(cum); }
      top.sort((a, b) => b - a); const k = Math.ceil(top.length * 0.1); const top10 = top.slice(0, k).reduce((s, v) => s + v, 0);
      return { n, r, tot, totR, top10: div(top10, totR), rep: div(n.slice(1).reduce((s, v) => s + v, 0), tot) }; });
    const sizeM = mix(SIZE_BINS, (usd) => usd), freqM = mix(FREQ_BINS, (usd, tx) => tx);
    const panel = (title, sub, labels, cols, data, key, extraRow, lines) => {
      const c = card(title, sub, ''); grid.appendChild(c);
      const hzr = document.createElement('div'); hzr.className = 'tgl'; hzr.innerHTML = `<div class="row2"><span class="lbl">Horizon</span>${hzSeg('mz')}</div>`; c.insertBefore(hzr, $('.plot', c));
      hzr.querySelectorAll('[data-mz]').forEach(b => b.onclick = () => { state.mz = +b.dataset.mz; render(); });
      if (!xs.length) { $('.plot', c).innerHTML = `<div class="empty">No install day with ≥ ${MIN_PAYERS} payers that has lived D${H} in this slice</div>`; return c; }
      perfChart($('.plot', c), { x: xs, W: 600, h: 260, yfmt: F.pct, yMax: 1, xfmt: F.date, maxLabels: 6, lines: lines || [],
        stack: labels.map((lab, i) => ({ name: lab, color: C[cols[i]], values: data.map(m => div(m[key][i], key === 'n' ? m.tot : m.totR)) })),
        extra: i => extraRow(data[i]) });
      legend(c, [...labels.map((lab, i) => ({ name: lab, color: C[cols[i]] })), ...(lines || []).map(l => ({ name: l.name, color: l.color }))]);
      return c;
    };
    panel(`Payer size at D${H} — share of payers`, `Per install date: payers bucketed by what they had spent by day ${H}. Install days with fewer than ${MIN_PAYERS} payers are skipped.`, SIZE_LABEL, SIZE_COL, sizeM, 'n', m => `<div class="row" style="color:var(--muted)"><span>payers · top-10 % share of revenue</span><span>${F.int(m.tot)} · ${F.pct(m.top10)}</span></div>`);
    panel(`Payer size at D${H} — share of IAP revenue`, 'Same buckets, weighted by revenue: where the money sits.', SIZE_LABEL, SIZE_COL, sizeM, 'r', m => `<div class="row" style="color:var(--muted)"><span>IAP revenue by D${H}</span><span>${F.usd(m.totR / 100)}</span></div>`);
    panel(`Payer frequency at D${H} — share of payers`, `Per install date: payers bucketed by number of purchases by day ${H}.`, FREQ_LABEL, FREQ_COL, freqM, 'n', m => `<div class="row" style="color:var(--muted)"><span>payers · repeat rate</span><span>${F.int(m.tot)} · ${F.pct1(m.rep)}</span></div>`);
    panel(`Payer frequency at D${H} — share of IAP revenue`, 'Same buckets, weighted by revenue. Revenue concentrating in 6+ while most payers buy once = a small core carrying the cohort.', FREQ_LABEL, FREQ_COL, freqM, 'r', m => `<div class="row" style="color:var(--muted)"><span>IAP revenue by D${H}</span><span>${F.usd(m.totR / 100)}</span></div>`);
  }
  // ---- revenue per payer distribution at horizon H (all cohorts old enough), the histogram behind the payer-size bars
  if (hasPayers) {
    const S = M.xs.filter(d => dayDiff(d, M.thru) >= H); const revs = [];
    for (const d of S) for (const at of M.by.get(d).vec) { const [cum, tx] = at[H]; if (tx > 0) revs.push(cum / 100); }
    revs.sort((a, b) => a - b); const tot = revs.reduce((a, v) => a + v, 0);
    const hist = BINS.map(() => 0), histRev = BINS.map(() => 0);
    for (const v of revs) { let i = BINS.findIndex(e => v < e); if (i < 0) i = BINS.length - 1; hist[i]++; histRev[i] += v; }
    const byRev = state.distMode === 'revenue';
    const cd = card(`Revenue per payer at D${H} — distribution`, `Where the payers sit, and where the money sits, by what each payer had spent by day ${H} (install days old enough to have lived D${H}: ${S.length ? F.date(S[0]) + ' – ' + F.date(S[S.length - 1]) : '–'}, ${F.int(revs.length)} payers). A distribution heavier on the right has a whale tail.`, 'full',
      [{ v: 'payers', label: '% of payers', on: !byRev }, { v: 'revenue', label: '% of revenue', on: byRev }]);
    grid.appendChild(cd);
    const hzr = document.createElement('div'); hzr.className = 'tgl'; hzr.innerHTML = `<div class="row2"><span class="lbl">Horizon</span>${hzSeg('mz')}</div>`; cd.insertBefore(hzr, $('.plot', cd));
    hzr.querySelectorAll('[data-mz]').forEach(b => b.onclick = () => { state.mz = +b.dataset.mz; render(); });
    if (!revs.length) $('.plot', cd).innerHTML = `<div class="empty">No payer has lived D${H} in this slice</div>`;
    else barChart($('.plot', cd), { cats: BIN_LABEL, W: 900, h: 260, yfmt: F.pct, maxLabels: 9, series: [{ name: byRev ? 'share of revenue' : 'share of payers', color: C.s2, values: byRev ? histRev.map(v => div(v, tot)) : hist.map(v => div(v, revs.length)) }],
      extra: i => `<div class="row" style="color:var(--muted)"><span>payers · revenue</span><span>${F.int(hist[i])} · ${F.usd(histRev[i])}</span></div>` });
    legend(cd, []);
    cd.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { state.distMode = b.dataset.t; render(); });
  }
  // ---- 5a. ARPDAU by calendar day (mart)
  if (P) {
    const c5 = card('ARPDAU by calendar day', 'Revenue per daily active user: ad, IAP net and total. Calendar-day view — all players active that day, whatever their install date.', '');
    grid.appendChild(c5);
    perfChart($('.plot', c5), { x: pxs, W: 600, h: 260, yfmt: F_usd2, xfmt: F.date, maxLabels: 5,
      lines: [{ name: 'Total ARPDAU', color: C.s4, width: 2.4, values: pxs.map(d => { const o = P.get(d); return div(o.iap_net + o.ad_rev, o.dau); }) }, { name: 'IAP ARPDAU', color: C.s2, values: pxs.map(d => { const o = P.get(d); return div(o.iap_net, o.dau); }) }, { name: 'Ad ARPDAU', color: C.s1, values: pxs.map(d => { const o = P.get(d); return div(o.ad_rev, o.dau); }) }],
      extra: i => `<div class="row" style="color:var(--muted)"><span>DAU</span><span>${F.int(P.get(pxs[i]).dau)}</span></div>` });
    legend(c5, [{ name: 'Total', color: C.s4 }, { name: 'IAP', color: C.s2 }, { name: 'Ads', color: C.s1 }]);
  }
  // ---- 5b. Dx IAP ARPPU by install date (events)
  if (hasPayers) {
    const xs = M.xs.filter(d => M.by.get(d).vec.length > 0);
    const c5b = card('IAP ARPPU by install cohort', `Per install date: cumulative IAP revenue by day N ÷ payers who had bought by day N. A point is hidden while fewer than ${MIN_PAYERS} players of that cohort have paid by day N (so a small cohort can show D7 before D0). Rises with the horizon as payers come back; a flat curve across horizons means one-and-done buying.`, '');
    grid.appendChild(c5b);
    perfChart($('.plot', c5b), { x: xs, W: 600, h: 260, yfmt: F_usd2, xfmt: F.date, maxLabels: 5,
      lines: MZ.map((n, i) => ({ name: `D${n}`, color: MZ_COLOR(i), values: xs.map(d => { const o = M.by.get(d); return dayDiff(d, M.thru) >= n && o.pay[n] >= MIN_PAYERS ? div(o.rev[n] / 100, o.pay[n]) : null; }) })),
      extra: i => { const o = M.by.get(xs[i]); return `<div class="row" style="color:var(--muted)"><span>payers by D0 · D1 · D3 · D7 · D14 · D30</span><span>${MZ.map(n => dayDiff(xs[i], M.thru) >= n ? F.int(o.pay[n]) : '·').join(' · ')}</span></div><div class="row" style="color:var(--muted)"><span>points under ${MIN_PAYERS} payers hidden</span><span></span></div>`; } });
    legend(c5b, MZ.map((n, i) => ({ name: `D${n}`, color: MZ_COLOR(i) })));
  }
  // card order: revenue mix · ARPDAU · ARPPU first (the money per user and where it comes from), then payer conversion and the rest
  const firstCards = ['Revenue mix — IAP vs ads by calendar day', 'ARPDAU by calendar day', 'IAP ARPPU by install cohort'].map(t => [...grid.children].find(c => ($('h3', c) || {}).textContent === t)).filter(Boolean);
  firstCards.reverse().forEach(c => grid.insertBefore(c, grid.firstChild));
  // revenue-per-payer distribution sits right after the repeat-payers card, before the payer size / frequency cards
  const byTitle = re => [...grid.children].find(c => re.test(($('h3', c) || {}).textContent || ''));
  const dist = byTitle(/^Revenue per payer at D/), rep = byTitle(/^Repeat payers|^Repeat purchase/);
  if (dist && rep) rep.after(dist);
  const notes = document.createElement('div'); notes.className = 'notes';
  notes.innerHTML = `<h2>How to read this</h2><ul>
    <li><b>Two sources, on purpose.</b> <b>Game events</b>: every validated purchase the game reported (<code>iap_validated</code>, production, debugger users excluded), per player, joined to the install table — exact at any horizon. <b>Adjust data</b>: the UA team's dataset behind the Soft Launch Monitoring Tableau (Adjust-attributed installs, store-reported revenue, network spend). LTV, revenue mix and ARPDAU come from it, so they match Tableau to the cent and include the ad side.</li>
    <li><b>Cohort cards</b> (conversion, size, frequency, ARPPU) are by install date and only show a cohort once it has lived the horizon — the lines stop at the right-hand edge instead of dropping. The Horizon row on the payer size / frequency cards picks the age at which payers are bucketed (D${H} now); the same horizon drives the IAP-vs-ads split of CPI vs LTV in Profitability.</li>
    <li><b>Payer size</b> buckets what each payer had spent by day N (${SIZE_LABEL.join(' / ')}); <b>frequency</b> buckets their purchase count. Reading them at a fixed age avoids the Tableau trap of mixing a day-0 payer with a day-20 payer on the same bar. Days with fewer than ${MIN_PAYERS} payers are skipped.</li>
    <li><b>Calendar cards</b> (revenue mix, ARPDAU) are what was earned that day from everyone active, whatever their install date; they lag the cohort cards during a ramp.</li>
    <li>Product-family mix by purchase day is not here yet: the product query is bucketed by days since install, not purchase date — it needs one extra field and a re-pull. The cohort-window family split is in 05.</li>
  </ul>`;
  body.appendChild(notes);
}

/** Explanations on demand: "How to read this" blocks, card definitions and chart captions fold into <details>; header blurbs show one line until clicked. */
function foldText() {
  const fold = (el, label) => { if (el.closest('details.fold')) return; const d = document.createElement('details'); d.className = 'fold'; d.innerHTML = `<summary>${label}</summary>`; el.parentNode.insertBefore(d, el); d.appendChild(el); };
  root.querySelectorAll('.notes').forEach(n => { const h = n.querySelector('h2'); if (h) h.remove(); fold(n, 'How to read this'); });
  root.querySelectorAll('.card .defs').forEach(n => { fold(n, 'Definitions'); if (n.dataset.open) { const d = n.closest('details.fold'); if (d) d.open = true; } });

  const X = v => ml + (Math.max(-lim, Math.min(lim, v)) + lim) / (2 * lim) * (W - ml - mr);

    el('rect', { x: x0, y, width: Math.max(1.5, x1 - x0), height: rh - 8, rx: 3, fill: r.weak ? C.muted : v < 0 ? C.s1 : C.s2, opacity: r.weak ? 0.45 : 0.9 }, svg);
    const val = el('text', { x: W - mr + 8, y: y + 13, class: 'svgtext', style: 'fill:var(--ink-2)' }, svg); val.textContent = `${r.fmt(r.c)} vs ${r.fmt(r.t)}`;

  });

  hit.addEventListener('mousemove', ev => { const rc = svg.getBoundingClientRect(); const py = (ev.clientY - rc.top) * H / rc.height; const i = Math.max(0, Math.min(o.rows.length - 1, Math.floor((py - mt) / rh))); const r = o.rows[i]; showTip(plot, tip, `<b>${r.label}</b><div class="row"><span>churners</span><span>${r.fmt(r.c)}</span></div><div class="row"><span>retained</span><span>${r.fmt(r.t)}</span></div><div class="row"><span>lift</span><span>${(r.lift - 1 >= 0 ? '+' : '') + Math.round((r.lift - 1) * 100)}%</span></div>${r.note ? `<div class="row" style="color:var(--muted)"><span>${r.note}</span><span></span></div>` : ''}`, ev.clientX - rc.left, ev.clientY - rc.top); });

function family(pid) {
  const p = (pid || '').toLowerCase();
  if (/no_?video|no_?ads|noads|remove_?ads|adfree|no_?rv/.test(p)) return 'No-ads';
  if (/pass|season/.test(p)) return 'Pass';

const BIN_LABEL = ['<$1', '$1–2', '$2–5', '$5–10', '$10–20', '$20–50', '$50–100', '$100–200', '$200+'];

function iapAggregate(DS) {
  const [a, b] = state.dsi, thru = DS.meta.data_through;
  const ok = (r) => r.d >= state.from && r.d <= state.to && dayDiff(r.d, thru) >= b && (state.platform === 'all' || r.p === state.platform) && countryOk(r.c);
  let installs = 0, cohorts = new Set(), immature = new Set();
  for (const r of DS.installs) {

    if (state.platform !== 'all' && r.p !== state.platform) continue;
    if (!countryOk(r.c)) continue;
    if (dayDiff(r.d, thru) >= b) { installs += r.installs; cohorts.add(r.d); } else immature.add(r.d);
  }
  const revs = [], txns = [], dayRev = new Array(b + 1).fill(0), firstAt = new Array(b + 1).fill(0);
  let maxSingle = 0, payDays = 0;   // largest single purchase (a purchase day with exactly one transaction gives its exact price) and purchase days per payer
  const prods = new Map();
  let payersAll = 0;
  let repRev = 0;
  for (const r of DS.payers) {
    if (!ok(r)) continue;
    for (const vec of r.payers) {
      let rev = 0, tx = 0, first = -1;
      let days = 0;
      for (const [dsi, c, t] of vec) { if (dsi < a || dsi > b) continue; rev += c; tx += t; dayRev[dsi] += c; if (first < 0) first = dsi; days++; if (t === 1 && c > maxSingle) maxSingle = c; }
      if (tx > 0) { revs.push(rev / 100); txns.push(tx); firstAt[first]++; payersAll++; if (tx >= 2) repRev += rev / 100; payDays += days; }
    }
  }
  // products: cells = [install_day_index, dsi_bucket, txns, cents, first_purchases]; buckets fully inside [a,b] (fallback: intersecting)
  const BK = DS.meta.dsi_buckets; let useB = Object.keys(BK).filter(k => BK[k][0] >= a && BK[k][1] <= b);
  const snapped = useB.length > 0; if (!snapped) useB = Object.keys(BK).filter(k => BK[k][1] >= a && BK[k][0] <= b);
  const useSet = new Set(useB.map(Number)); const base = new Date(DS.meta.base_date + 'T00:00:00Z');
  const diOk = di => { const dt = new Date(base); dt.setUTCDate(dt.getUTCDate() + di); const d = dt.toISOString().slice(0, 10); return d >= state.from && d <= state.to && dayDiff(d, thru) >= b; };
  for (const pr of DS.products) {

  revs.sort((x, y) => x - y);

  const top10n = Math.ceil(revs.length * 0.1), top10 = revs.slice(revs.length - top10n).reduce((s, v) => s + v, 0);

}

  $('#f-games-label').textContent = single ? 'Game' : 'Games';
  document.querySelectorAll('#f-mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.mode));

/** App version multi-select: versions seen on the selected game's version-aware datasets (players' latest tagged app version), with the number of installs (match 1) per version in the loaded data. Empty selection = all versions. */
function initVersions() {
  const blk = $('#f-versions-blk'); if (!blk) return;
  const g = REG.games.find(x => x.slug === (pending.games[0] || state.games[0])); const ds = g && DATA[g.slug];
  const counts = new Map();
  if (ds && ds.D && ds.D.meta.cols.includes('v')) { const ix = {}; ds.D.meta.cols.forEach((k, i) => ix[k] = i); for (const r of ds.D.rows) if (r[ix.n] === 1) counts.set(r[ix.v], (counts.get(r[ix.v]) || 0) + r[ix.users]); }
  const vers = [...counts.entries()].sort((a, b) => b[1] - a[1]);
  blk.style.display = vers.length ? '' : 'none'; if (!vers.length) { pending.versions = []; return; }
  pending.versions = (pending.versions || []).filter(v => counts.has(v));
  const box = $('#f-versions-list'); box.innerHTML = '';

    const row = document.createElement('label'); row.className = 'gopt';
    row.innerHTML = `<input type="checkbox" value="${v}" ${pending.versions.includes(v) ? 'checked' : ''}><span>${v}</span><small>${F.int(n)} installs</small>`;
    row.querySelector('input').onchange = () => { pending.versions = [...box.querySelectorAll('input:checked')].map(x => x.value); verLabel(); markDirty(); };
    box.appendChild(row);
  }
  const verLabel = () => { $('#f-versions-btn span').textContent = pending.versions.length ? `${pending.versions.length}/${vers.length} versions` : 'All versions'; };
  verLabel();
  $('#f-versions-btn').onclick = () => $('#f-versions').classList.toggle('open');
  document.addEventListener('click', e => { if (!$('#f-versions').contains(e.target)) $('#f-versions').classList.remove('open'); });
}
function initRange() {
  // dual-handle slider over the union of install dates of the selected games (pending selection)
  const prevGames = state.games; state.games = pending.games; const m = META(); state.games = prevGames;
  const lo = $('#r-lo'), hi = $('#r-hi');
  if (!m.install_min) { lo.disabled = hi.disabled = true; return; }
  const days = dayList(m.install_min, m.install_max); lo.disabled = hi.disabled = false;
  lo.min = hi.min = 0; lo.max = hi.max = days.length - 1;
  const idx = d => Math.max(0, Math.min(days.length - 1, days.indexOf(d) < 0 ? (d < days[0] ? 0 : days.length - 1) : days.indexOf(d)));
  if (!pending.from) pending.from = lastX(m.install_max, pending.lastx || 14); if (!pending.to) pending.to = m.install_max;
  lo.value = idx(pending.from); hi.value = idx(pending.to);
  const paint = () => { let a = +lo.value, b = +hi.value; if (a > b) [a, b] = [b, a]; pending.from = days[a]; pending.to = days[b];
    $('#r-lo-lab').textContent = F.date(pending.from); $('#r-hi-lab').textContent = F.date(pending.to);
    const pct = v => (v / Math.max(1, days.length - 1) * 100).toFixed(2) + '%'; $('#r-fill').style.left = pct(a); $('#r-fill').style.right = (100 - parseFloat(pct(b))) + '%'; };
  lo.oninput = hi.oninput = () => { pending.rangeMode = 'fixed'; paint(); markDirty(); }; paint();
  document.querySelectorAll('.quick[data-scope="install"] button').forEach(b => b.onclick = () => {
    pending.rangeMode = 'all'; pending.from = m.install_min; pending.to = m.install_max; lo.value = idx(pending.from); hi.value = idx(pending.to); paint(); markDirty();
  });
  const lx = $('#f-lastx'); lx.value = pending.lastx || 14;
  lx.onchange = () => { const n = Math.max(1, Math.min(365, parseInt(lx.value, 10) || 14)); lx.value = n; pending.lastx = n; pending.rangeMode = 'last'; pending.from = lastX(m.install_max, n); if (pending.from < m.install_min) pending.from = m.install_min; pending.to = m.install_max; lo.value = idx(pending.from); hi.value = idx(pending.to); paint(); markDirty(); };
}

// ---------- saved default view (per browser; the artifact is private, so this is the viewer's own default)
const VIEW_KEY = 'cockpit.view';
const VIEW_FIELDS = ['mode', 'retView', 'games', 'platform', 'country', 'network', 'view', 'lastx', 'rangeMode', 'from', 'to', 'win', 'tblView', 'day', 'survMode', 'arenaMode', 'retDef', 'perfMode', 'ltvMode', 'dauMode', 'payMode', 'mz', 'convSrc', 'convView', 'repView', 'sovMode', 'tab', 'ptab', 'mtab', 'unitLo', 'unitHi', 'ecoPay', 'ecoAxis', 'ecoCur', 'csCp', 'versions', 'iapArena', 'iapArenaY', 'iapScore'];
function loadView() { try { return JSON.parse(localStorage.getItem(VIEW_KEY) || 'null'); } catch (e) { return null; } }
function saveView() {
  const v = {}; for (const k of VIEW_FIELDS) v[k] = JSON.parse(JSON.stringify(state[k] === undefined ? null : state[k]));
  v.groups = JSON.parse(localStorage.getItem(OPEN_KEY) || '{}'); v.savedAt = new Date().toISOString().slice(0, 10);
  try { localStorage.setItem(VIEW_KEY, JSON.stringify(v)); } catch (e) {}
  paintViewStatus();
}
function resetView() { try { localStorage.removeItem(VIEW_KEY); localStorage.removeItem(OPEN_KEY); } catch (e) {} paintViewStatus(); location.hash = ''; location.reload(); }
function describeView(v) {
  const names = (v.games || []).map(sl => { const g = REG && REG.games.find(x => x.slug === sl); return g ? (g.short || g.name) : sl; }).join(' · ');
  const range = v.rangeMode === 'all' ? 'all installs' : v.rangeMode === 'fixed' ? `${F.date(v.from)} – ${F.date(v.to)}` : `last ${v.lastx || 14} days`;
  const bits = [names, v.platform === 'all' ? 'all platforms' : v.platform, v.country === 'all' ? 'all countries' : v.country === 'rest' ? 'rest of world' : v.country, v.network !== 'all' ? (NET_LABEL[v.network] || v.network) : null, range, v.win ? WIN_LABEL[v.win] : null].filter(Boolean);
  return bits.join(' · ');
}
function paintViewStatus() { const v = loadView(); const el = $('#view-status'); if (!el) return; el.innerHTML = v ? `<b>Saved${v.savedAt ? ' ' + F.date(String(v.savedAt).slice(0, 10)) : ''}</b> — ${describeView(v)}` : 'Cockpit default · nothing saved yet'; }
/** apply a saved view to state before the first load; the URL hash (a shared link) still wins for the game list */
function applySavedView(v, hashGames) {
  for (const k of VIEW_FIELDS) if (v[k] !== undefined && v[k] !== null && !(k === 'games' && hashGames.length)) state[k] = JSON.parse(JSON.stringify(v[k]));
  state.games = (state.games || []).filter(sl => REG.games.some(g => g.slug === sl && g.data && Object.values(g.data).some(Boolean)));
  if (v.groups) try { localStorage.setItem(OPEN_KEY, JSON.stringify(v.groups)); } catch (e) {}
}

async function applyFilters() {
  const b = $('#btn-refresh'); b.textContent = '↻ Refreshing…'; b.disabled = true;
  // reload data for the selected games (cache-busted) so a republished dataset shows up without a hard reload
  for (const sl of pending.games) await loadGameData(sl, true);
  Object.assign(state, JSON.parse(JSON.stringify(pending)));
  const m = META(); if (m.install_min && state.rangeMode === 'last') { state.from = lastX(m.install_max, state.lastx); if (state.from < m.install_min) state.from = m.install_min; state.to = m.install_max; }
  if (m.install_min && state.rangeMode === 'all') { state.from = m.install_min; state.to = m.install_max; }
  if (m.install_min) { state.from = state.from < m.install_min ? m.install_min : state.from > m.install_max ? m.install_max : state.from; state.to = state.to > m.install_max ? m.install_max : state.to < m.install_min ? m.install_min : state.to; if (state.from > state.to) [state.from, state.to] = [state.to, state.from]; }
  location.hash = state.games.join(',');
  $('#meta').innerHTML = selected().map(g => { const d = DATA[g.slug] || {}; const thru = (d.IAP && d.IAP.meta.data_through) || (d.D && d.D.meta.install_max); const built = (d.IAP && d.IAP.meta.built) || (d.D && d.D.meta.built); return `<span><b>${g.short || g.name}</b> data through ${thru ? F.date(thru) : '–'}${built ? ` · pulled ${F.date(built)}` : ''}</span>`; }).join('');
  initRange(); render();
  b.classList.remove('dirty'); b.textContent = '↻ Refresh'; b.disabled = false;
}

// ---------- game registry / loading
// Encrypted studio build (build_page.py --studio --passphrase): every JSON file is published as <name>.enc
// (base64 of salt(16) + iv(12) + AES-GCM ciphertext; key = PBKDF2-SHA256 of the passphrase, 200k rounds).
// The page asks for the passphrase once per browser (remembered in localStorage, best effort) and decrypts in the browser.
const ENC = window.COCKPIT_ENC ? { pass: null } : null;
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function decryptText(b64, pass) {
  const raw = b64d(b64.trim()); const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const key = await deriveKey(pass, salt);
  const plain = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
  if (plain[0] === 0x1f && plain[1] === 0x8b) return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();   // gzip-then-encrypt builds
  return new TextDecoder().decode(plain);
}
async function fetchJsonMaybeEnc(path, bust) {
  const q = bust ? '?t=' + Date.now() : '';
  if (!ENC) { const r = await fetch(path + q, { cache: 'no-store' }); return r.ok ? r.json() : null; }
  const r = await fetch(path + '.enc' + q, { cache: 'no-store' }); if (!r.ok) return null;
  return JSON.parse(await decryptText(await r.text(), ENC.pass));
}
// passphrase gate: resolves with the registry once games.json decrypts with the passphrase typed (or remembered)
function askPassphrase() {
  return new Promise(resolve => {
    let saved = null; try { saved = localStorage.getItem('cockpit_pass'); } catch (e) {}
    const gate = document.createElement('div'); gate.id = 'gate';
    gate.innerHTML = '<form class="gatebox"><div class="eyebrow">Voodoo · Cockpit</div><h2>Enter the passphrase</h2><p>This page is shared with the studio only. The passphrase was sent to you separately.</p><input type="password" autocomplete="current-password" placeholder="Passphrase" autofocus><label class="rem"><input type="checkbox" checked> Remember on this browser</label><button type="submit">Open the cockpit</button><div class="err" hidden>That passphrase does not open this page.</div></form>';
    document.body.appendChild(gate);
    const input = gate.querySelector('input[type=password]'), err = gate.querySelector('.err'), rem = gate.querySelector('.rem input');
    const tryPass = async pass => {
      try { const r = await fetch('games.json.enc', { cache: 'no-store' }); const reg = JSON.parse(await decryptText(await r.text(), pass)); ENC.pass = pass; if (rem.checked) { try { localStorage.setItem('cockpit_pass', pass); } catch (e) {} } gate.remove(); resolve(reg); return true; }
      catch (e) { return false; }
    };
    gate.querySelector('form').onsubmit = async e => { e.preventDefault(); err.hidden = true; if (!(await tryPass(input.value))) { err.hidden = false; try { localStorage.removeItem('cockpit_pass'); } catch (x) {} } };
    if (saved) tryPass(saved).then(ok => { if (!ok) { try { localStorage.removeItem('cockpit_pass'); } catch (x) {} } });
  });
}
async function loadJson(path, bust) {
  const key = path;
  if (!bust && CACHE[key] !== undefined) return CACHE[key];
  try { CACHE[key] = await fetchJsonMaybeEnc(path, bust); } catch (e) { CACHE[key] = null; }
  return CACHE[key];
}
async function loadGameData(slug, bust) {
  const g = REG.games.find(x => x.slug === slug); if (!g) return null;
  const [d, iap, dy, pf, vs, un, ec, cs, idet] = await Promise.all([g.data && g.data.matches ? loadJson(`g/${slug}/matches.json`, bust) : null, g.data && g.data.iap ? loadJson(`g/${slug}/iap.json`, bust) : null, g.data && g.data.daily ? loadJson(`g/${slug}/daily.json`, bust) : null, g.data && g.data.profit ? loadJson(`g/${slug}/profit.json`, bust) : null, g.data && g.data.daily && g.events !== false ? loadJson(`g/${slug}/versions.json`, bust) : null, g.data && g.data.units ? loadJson(`g/${slug}/units.json`, bust) : null, g.data && g.data.econ ? loadJson(`g/${slug}/econ.json`, bust) : null, g.data && g.data.churnseg ? loadJson(`g/${slug}/churnseg.json`, bust) : null, g.data && g.data.iapdetail ? loadJson(`g/${slug}/iapdetail.json`, bust) : null]);
  let rows = [];
  if (d) { const c = d.meta.cols; const ix = {}; c.forEach((k, i) => ix[k] = i); rows = d.rows.map(r => ({ d: r[ix.d], p: r[ix.p], c: r[ix.c], a: r[ix.arena], n: r[ix.n], u: r[ix.users], w: r[ix.wins], l: r[ix.last], ll: r[ix.last_loss] })); }
  let dyRows = [];
  if (dy) { const c = dy.meta.cols; const ix = {}; c.forEach((k, i) => ix[k] = i); dyRows = dy.rows.map(r => { const o = {}; c.forEach((k, i) => o[k] = r[i]); return o; }); }
  let pfRows = [];
  if (pf) { const c = pf.meta.cols; pfRows = pf.rows.map(r => { const o = {}; c.forEach((k, i) => o[k] = r[i]); return o; }); }
  DATA[slug] = { D: d, ROWS: rows, IAP: iap, DY: dy, DYROWS: dyRows, PF: pf, PFROWS: pfRows, VS: vs, UN: un, EC: ec, CS: cs, ID: idet };
  return DATA[slug];
}
(ENC ? askPassphrase() : fetch('games.json', { cache: 'no-store' }).then(r => r.json())).then(async reg => {
  REG = reg;
  const fromHash = (location.hash || '').replace('#', '').split(',').filter(Boolean).filter(sl => reg.games.some(g => g.slug === sl));
  state.games = fromHash.length ? fromHash : (reg.default_games || reg.games.filter(g => g.data && (g.data.matches || g.data.iap)).map(g => g.slug));
  const saved = loadView(); if (saved) applySavedView(saved, fromHash);
  if (!state.games.length) state.games = reg.default_games || [];
  if (state.mode === 'single' && state.games.length > 1) state.games = [state.games[0]];
  // studio build (build_page.py --studio): one game, fixed; no game selector, no mode switch; studio-facing title
  if (reg.studio && reg.studio.slug) {
    state.mode = 'single'; state.games = [reg.studio.slug];
    const h = $('header.top h1'), eb = $('header.top .eyebrow');
    if (h) h.textContent = reg.studio.title || h.textContent; if (eb) eb.textContent = reg.studio.eyebrow || eb.textContent; document.title = reg.studio.title || document.title;
    const gb = $('#f-games'); if (gb && gb.closest('.blk')) gb.closest('.blk').style.display = 'none';
    const mb = $('.blk.mode'); if (mb) mb.style.display = 'none';
  }
  root.innerHTML = '<div class="status">Loading…</div>';
  for (const sl of state.games) await loadGameData(sl);
  const m = META();
  if (state.rangeMode === 'all' && m.install_min) { state.from = m.install_min; state.to = m.install_max; }
  else if (state.rangeMode === 'fixed' && state.from && state.to && m.install_min) { state.from = state.from < m.install_min ? m.install_min : state.from; state.to = state.to > m.install_max ? m.install_max : state.to; }
  else { state.from = m.install_min ? lastX(m.install_max, state.lastx) : null; if (state.from && state.from < m.install_min) state.from = m.install_min; state.to = m.install_max; }
  initSidebar(); pending.from = state.from; pending.to = state.to; initRange();
  paintViewStatus(); $('#btn-save-view').onclick = () => { saveView(); const b = $('#btn-save-view'); b.textContent = '✓ Saved'; setTimeout(() => b.textContent = '★ Save current as default', 1500); }; $('#btn-reset-view').onclick = resetView;
  await applyFilters();
}).catch(e => { root.innerHTML = `<div class="status">Could not load games.json — ${e.message}</div>`; });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => REG && render());
})();
